server {
    listen 33340;
    server_name jobmate.techcreed.in _;

    root /usr/share/nginx/html;
    index index.html;

    location = /healthz {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "ok\n";
    }

    # Block hidden files (.env, .git, etc.) if ever placed in webroot
    location ~ /\. {
        deny all;
        return 404;
    }

    include /etc/nginx/conf.d/api-proxy.inc;

    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }
}

